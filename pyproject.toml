[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honeypot-server"
version = "0.1.0"
description = "Fake services (HTTP, FTP, SSH, SMTP, DNS) that log every probe — a low-interaction honeypot."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["honeypot", "security", "deception", "network", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Networking",
]

[project.scripts]
honeypot = "honeypot_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
