[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honeypot-server"
version = "0.2.0"
description = "Low-interaction honeypot and deception platform: eight protocol decoys, persona engine, tar pit, canary tokens, attacker TTP classification, IOC feeds and dashboards."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["honeypot", "security", "deception", "network", "cli", "canary", "mitre-attack", "tar-pit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Networking",
]

[project.scripts]
honeypot = "honeypot_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
