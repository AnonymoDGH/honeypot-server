<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="820" height="400" fill="url(#bg)"/>
  <text x="410" y="40" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">Honeypot Server — Architecture</text>

  <!-- Intruder -->
  <rect x="30" y="150" width="140" height="90" rx="10" fill="url(#box)" stroke="#f85149" stroke-width="2"/>
  <text x="100" y="180" fill="#f85149" font-size="15" font-weight="700" text-anchor="middle">intruder</text>
  <text x="100" y="202" fill="#8b949e" font-size="12" text-anchor="middle">port scan</text>
  <text x="100" y="220" fill="#8b949e" font-size="12" text-anchor="middle">banner grab</text>

  <!-- Decoys -->
  <rect x="250" y="60" width="180" height="60" rx="10" fill="url(#box)" stroke="#58a6ff" stroke-width="2"/>
  <text x="340" y="90" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle">HTTP :80 · FTP :21</text>
  <text x="340" y="108" fill="#8b949e" font-size="11" text-anchor="middle">fakes: banners, pages</text>
  <rect x="250" y="150" width="180" height="60" rx="10" fill="url(#box)" stroke="#58a6ff" stroke-width="2"/>
  <text x="340" y="180" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle">SSH :22 · SMTP :25</text>
  <text x="340" y="198" fill="#8b949e" font-size="11" text-anchor="middle">fakes: protocol talk</text>
  <rect x="250" y="240" width="180" height="60" rx="10" fill="url(#box)" stroke="#58a6ff" stroke-width="2"/>
  <text x="340" y="270" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle">DNS :53 (UDP)</text>
  <text x="340" y="288" fill="#8b949e" font-size="11" text-anchor="middle">logs query names</text>

  <!-- Logger -->
  <rect x="530" y="140" width="200" height="110" rx="10" fill="url(#box)" stroke="#3fb950" stroke-width="2"/>
  <text x="630" y="172" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">JSONL logger</text>
  <text x="630" y="196" fill="#8b949e" font-size="12" text-anchor="middle">ts · service · src</text>
  <text x="630" y="214" fill="#8b949e" font-size="12" text-anchor="middle">event · payload</text>
  <text x="630" y="236" fill="#8b949e" font-size="12" text-anchor="middle">→ trap.jsonl</text>

  <!-- Arrows -->
  <path d="M 170 195 L 250 180" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 170 195 L 250 165" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 250 195 L 340 195 L 340 250 L 530 250" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 430 90 L 530 165" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 430 180 L 530 195" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <text x="410" y="370" fill="#8b949e" font-size="11" text-anchor="middle">Fiction prop for novel research. Run decoys on networks you own.</text>
</svg>
